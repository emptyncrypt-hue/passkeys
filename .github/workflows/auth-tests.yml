name: Authentication tests
on:
  pull_request:
    paths:
      - 'index.js'
      - 'security.js'
      - 'storage.js'
      - 'tests/**'
      - 'passkey-frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/auth-tests.yml'
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:frontend
